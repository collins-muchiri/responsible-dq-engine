# Pre-commit hooks: secret scanning plus the same static-analysis gates as CI.
# Install with:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-c", ".bandit", "-r", "src"]

  - repo: https://github.com/semgrep/semgrep
    rev: v1.99.0
    hooks:
      - id: semgrep
        args: ["--config", ".semgrep.yml", "--error", "src"]
